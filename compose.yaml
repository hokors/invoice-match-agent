# Local Odoo 19 Community sandbox for the invoice match agent.
#   docker compose up -d      -> http://localhost:8069
#   docker compose down       (data is kept in the named volumes)
# Copy .env.example to .env first.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    ports:
      # Only reachable from this PC.
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  pg-data:
  odoo-data:
